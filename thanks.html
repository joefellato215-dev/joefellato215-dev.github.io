<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Message Sent — Joefel M. Lato</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class"
        };
    </script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-white">
    <main class="flex min-h-screen items-center justify-center px-5">
        <div class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm dark:border-slate-800 dark:bg-slate-900">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-indigo-100 text-3xl dark:bg-indigo-500/10">
                ✓
            </div>

            <h1 class="mt-6 text-3xl font-bold">
                Message Sent
            </h1>

            <p class="mt-4 leading-7 text-slate-600 dark:text-slate-400">
                Thank you for reaching out. Your message has been sent successfully.
                I'll get back to you as soon as possible.
            </p>

            <a
                href="https://joefellato215-dev.github.io/"
                class="mt-8 inline-flex rounded-lg bg-indigo-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-indigo-700"
            >
                Back to Portfolio
            </a>
        </div>
    </main>
</body>
</html>
